<svg xmlns="http://www.w3.org/2000/svg" width="731" height="608" viewBox="0 0 731 608" role="img" aria-labelledby="title desc"><title id="title">Unity 6 Build Profiles 視窗</title><desc id="desc">Windows 為 Active，Android 列在平台清單但尚未啟用。</desc><rect width="731" height="608" rx="8" fill="#202225"/><style>.t{font:14px 'Segoe UI',Arial,sans-serif;fill:#ddd}.m{font:12px 'Segoe UI',Arial,sans-serif;fill:#aaa}.s{font:11px 'Segoe UI',Arial,sans-serif;fill:#858a90}.p{fill:#2c2f34;stroke:#555}.b{fill:#50545a;stroke:#777}.l{stroke:#4c5055}</style><rect x="0" y="0" width="731" height="30" fill="#121315"/><text class="t" x="14" y="20">Build Profiles</text><rect x="8" y="42" width="105" height="27" class="p"/><text class="t" x="20" y="60">Build Profiles</text><rect x="8" y="75" width="211" height="513" fill="#24272b"/><text class="t" x="23" y="104">Scene List</text><text class="m" x="23" y="131">Platforms</text><rect x="18" y="138" width="188" height="27" fill="#3c4147"/><text class="t" x="31" y="157">Windows</text><rect x="162" y="144" width="45" height="16" rx="3" fill="#12543a" stroke="#35d488"/><text class="m" x="168" y="156" fill="#8ff4ba">Active</text><text class="m" x="31" y="184">Web</text><text class="m" x="31" y="210">macOS</text><text class="m" x="31" y="236">Linux</text><text class="s" x="31" y="288">Android</text><text class="s" x="31" y="314">iOS</text><text class="s" x="31" y="340">PlayStation®4</text><text class="s" x="31" y="366">Meta Quest</text><text class="s" x="31" y="392">Android XR</text><text class="m" x="20" y="438">Build Profiles</text><text class="m" x="20" y="470">Welcome to Build Profiles.</text><text class="s" x="20" y="492">Add a Build Profile to configure</text><text class="s" x="20" y="509">settings for each supported platform.</text><rect x="55" y="551" width="112" height="29" rx="4" class="b"/><text class="t" x="68" y="571">Add Build Profile</text><rect x="235" y="75" width="482" height="513" class="p"/><rect x="255" y="88" width="44" height="44" rx="5" fill="#353940"/><path d="M266 99h11v11h-11zm14 0h11v11h-11zm-14 14h11v11h-11zm14 0h11v11h-11z" fill="#ddd"/><text class="t" x="310" y="115" style="font-size:27px">Windows</text><rect x="255" y="149" width="435" height="73" rx="4" class="p"/><text class="m" x="273" y="177">Starting in Unity 6.2 Diagnostics Data is on by default for new projects.</text><rect x="625" y="195" width="60" height="24" rx="3" class="b"/><text class="m" x="639" y="212">Dismiss</text><rect x="255" y="239" width="435" height="78" rx="4" class="p"/><text class="m" x="273" y="267">Platform builds use the shared scene list. Create a Build Profile</text><text class="m" x="273" y="285">to store platform-specific settings.</text><rect x="586" y="288" width="99" height="24" rx="3" class="b"/><text class="m" x="600" y="305">Add Build Profile</text><text class="t" x="260" y="347">▾ Scene List</text><rect x="269" y="357" width="416" height="56" class="p"/><text class="m" x="298" y="384">Scenes/GetStarted_Scene</text><text class="t" x="260" y="461">▾ Platform Settings (Windows)</text><text class="m" x="297" y="490">Architecture</text><rect x="500" y="475" width="182" height="21" class="b"/><text class="m" x="510" y="490">Intel 64-bit</text><text class="m" x="297" y="520">Build and Run on</text><rect x="500" y="505" width="182" height="21" class="b"/><text class="m" x="510" y="520">Local Machine</text><text class="s" x="25" y="603">Android 出現在清單中，不等於 Android Build Support 已完整安裝。</text></svg>