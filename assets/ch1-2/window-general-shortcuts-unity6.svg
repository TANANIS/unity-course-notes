<rect class="b" x=".5" y=".5" width="306" height="440" rx="3"/><rect class="b" x="307" y="125" width="301" height="286" rx="3"/><text class="m" x="4" y="15">Window　Help</text><line class="l" x1="0" y1="21" x2="609" y2="21"/>
