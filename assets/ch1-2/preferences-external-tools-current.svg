<svg xmlns="http://www.w3.org/2000/svg" width="832" height="614" viewBox="0 0 832 614" role="img" aria-labelledby="title desc"><title id="title">Unity 6 Preferences External Tools</title><desc id="desc">External Tools 只顯示 VS Code 與版本控制工具，沒有 Android SDK、NDK、JDK 區塊。</desc><rect width="832" height="614" rx="8" fill="#202225"/><style>.t{font:14px 'Segoe UI',Arial,sans-serif;fill:#ddd}.m{font:12px 'Segoe UI',Arial,sans-serif;fill:#aaa}.s{font:11px 'Segoe UI',Arial,sans-serif;fill:#868b91}.i{fill:#4a4e54;stroke:#73787f}.l{fill:#292c31;stroke:#555}</style><rect width="832" height="30" fill="#121315"/><text class="t" x="14" y="20">Preferences</text><rect x="8" y="41" width="104" height="27" class="l"/><text class="t" x="21" y="59">Preferences</text><rect x="528" y="39" width="299" height="22" rx="4" fill="#181a1d" stroke="#6aaafa"/><rect x="0" y="76" width="151" height="538" fill="#24272b"/><text class="t" x="19" y="100">General</text><text class="m" x="9" y="126">▾ 2D</text><text class="m" x="32" y="151">Physics</text><text class="m" x="9" y="177">▾ Analysis</text><text class="m" x="32" y="203">Build Pipeline</text><text class="m" x="32" y="229">Profiler</text><text class="m" x="32" y="255">Project Auditor</text><text class="m" x="9" y="281">Asset Pipeline</text><text class="m" x="9" y="307">Cinemachine</text><text class="m" x="9" y="333">Colors</text><text class="m" x="9" y="359">Editor Diagnostics</text><rect x="0" y="366" width="151" height="27" fill="#3b4046"/><text class="t" x="19" y="385">External Tools</text><text class="m" x="9" y="419">GI Cache</text><text class="m" x="9" y="445">Graph</text><text class="m" x="9" y="471">Graphics</text><text class="m" x="9" y="497">In-Editor Tutorials</text><text class="m" x="9" y="523">Jobs</text><text class="m" x="9" y="549">Overlays</text><text class="m" x="9" y="575">Package Manager</text><text class="t" x="164" y="99" style="font-size:24px">External Tools</text><text class="m" x="164" y="132">External Script Editor</text><rect x="414" y="116" width="414" height="23" rx="3" class="i"/><text class="t" x="423" y="132">Visual Studio Code (internal)</text><text class="m" x="164" y="159">External Script Editor Args</text><rect x="414" y="144" width="414" height="23" rx="3" class="i"/><text class="t" x="423" y="160">$(File)</text><rect x="164" y="174" width="121" height="24" rx="4" class="i"/><text class="m" x="178" y="191">Reset argument</text><text class="m" x="164" y="225">Image application</text><rect x="414" y="210" width="414" height="23" rx="3" class="i"/><text class="t" x="423" y="226">Open by file extension</text><text class="m" x="164" y="263">Revision Control Diff/Merge</text><text class="m" x="164" y="289">Tool Path</text><rect x="414" y="274" width="331" height="23" rx="3" class="i"/><rect x="750" y="274" width="78" height="23" rx="3" class="i"/><text class="m" x="773" y="290">Browse</text><rect x="164" y="320" width="664" height="164" rx="4" class="l"/><text class="t" x="224" y="351">No supported VCS diff tools were found.</text><text class="m" x="224" y="378">SourceGear DiffMerge · TkDiff · P4Merge · Araxis Merge</text><text class="m" x="224" y="403">TortoiseMerge · WinMerge · PlasticSCM Merge · Beyond Compare 4</text><rect x="164" y="513" width="664" height="70" rx="5" fill="#34272a" stroke="#a84c55"/><text class="t" x="184" y="541">此畫面沒有 Android SDK / NDK / JDK 區塊。</text><text class="m" x="184" y="564">通常表示目前 Editor 尚未安裝 Android Build Support 與相關工具鏈。</text></svg>