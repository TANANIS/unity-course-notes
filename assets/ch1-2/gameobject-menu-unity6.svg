<svg xmlns="http://www.w3.org/2000/svg" width="292" height="586" viewBox="0 0 292 586" role="img" aria-labelledby="title desc"><title id="title">Unity 6 GameObject 選單</title><desc id="desc">可建立 Empty、Empty Child、Empty Parent、2D、3D、Light、Audio、UI、Camera 等場景 GameObject。</desc><rect width="292" height="586" rx="5" fill="#fafafa"/><style>.t{font:13px 'Segoe UI',Arial,sans-serif;fill:#111}.m{font:13px 'Segoe UI',Arial,sans-serif;fill:#aaa}.k{font:12px 'Segoe UI',Arial,sans-serif;fill:#111;text-anchor:end}.l{stroke:#ddd}</style><text class="t" x="37" y="21">Create Empty</text><text class="k" x="282" y="21">Ctrl+Shift+N</text><text class="t" x="37" y="46">Create Empty Child</text><text class="k" x="282" y="46">Alt+Shift+N</text><text class="t" x="37" y="71">Create Empty Parent</text><text class="k" x="282" y="71">Ctrl+Shift+G</text><text class="t" x="37" y="101">2D Object</text><text class="t" x="275" y="101">›</text><text class="t" x="37" y="126">3D Object</text><text class="t" x="275" y="126">›</text><text class="t" x="37" y="151">Visual Effects</text><text class="t" x="275" y="151">›</text><text class="t" x="37" y="176">Light</text><text class="t" x="275" y="176">›</text><text class="t" x="37" y="201">Audio</text><text class="t" x="275" y="201">›</text><text class="t" x="37" y="226">Video</text><text class="t" x="275" y="226">›</text><text class="t" x="37" y="251">UI (Canvas)</text><text class="t" x="275" y="251">›</text><text class="t" x="37" y="276">UI Toolkit</text><text class="t" x="275" y="276">›</text><text class="t" x="37" y="301">Rendering</text><text class="t" x="275" y="301">›</text><text class="t" x="37" y="326">Spline</text><text class="t" x="275" y="326">›</text><text class="t" x="37" y="351">Volume</text><text class="t" x="275" y="351">›</text><text class="t" x="37" y="376">Cinemachine</text><text class="t" x="275" y="376">›</text><text class="t" x="37" y="406">Camera</text><line class="l" x1="8" y1="426" x2="284" y2="426"/><text class="m" x="37" y="451">Center On Children</text><line class="l" x1="8" y1="471" x2="284" y2="471"/><text class="m" x="37" y="496">Make Parent</text><text class="m" x="37" y="521">Clear Parent</text><line class="l" x1="8" y1="541" x2="284" y2="541"/><text class="t" x="37" y="566">Move To View</text><text class="k" x="282" y="566">Ctrl+Alt+F</text></svg>