  <circle cx="48" cy="19" r="4" fill="#e85b4f"/>
  <circle cx="55" cy="12" r="4" fill="#62c676"/>
  <circle cx="62" cy="19" r="4" fill="#5796df"/>
  <text x="76" y="25" fill="#e7e7e7" font-family="Segoe UI,Arial,sans-serif" font-size="20">Transform</text>
