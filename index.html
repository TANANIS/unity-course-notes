<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TANA 的 Unity 3D 遊戲課程重修筆記。">
  <title>Unity 3D 課程筆記</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body class="home-page">
  <a class="skip-link" href="#main-content">跳至主要內容</a>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="回到首頁">
      <span class="brand-mark" aria-hidden="true">U</span>
      <span><strong>Unity Notes</strong><small>TANA'S LEARNING LOG</small></span>
    </a>
    <nav class="top-actions" aria-label="網站操作">
      <a class="text-link" href="https://github.com/TANANIS/unity-course-notes" target="_blank" rel="noreferrer">GitHub</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false">◐</button>
    </nav>
  </header>

  <main id="main-content" class="home-shell">
    <section class="home-hero">
      <span class="eyebrow">COURSE LIBRARY</span>
      <h1>我的 Unity<br><em>課程筆記。</em></h1>
      <p>課程是入口，章節是地圖，筆記只在需要時打開。終於不再一進門就遭到兩篇長文伏擊。</p>
    </section>

    <section class="course-library" aria-labelledby="library-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">1 COURSE</span>
          <h2 id="library-title">目前課程</h2>
        </div>
      </div>

      <a class="course-card" href="course.html">
        <div class="course-visual" aria-hidden="true">
          <span class="unity-cube">U</span>
          <span class="course-code">UNITY / C#</span>
        </div>
        <div class="course-card-body">
          <div class="course-status-row">
            <span class="status-pill">重修中</span>
            <span>2 堂筆記</span>
          </div>
          <h3>Unity3D 遊戲設計使用 C#</h3>
          <p>從 Unity 基礎環境、C# 語法，到 3D 與 2D 遊戲實作。筆記同步標示舊版課程內容與現代 Unity 差異。</p>
          <div class="course-progress" aria-label="課程筆記進度 2 之 198">
            <div><span>筆記進度</span><strong>2 / 198</strong></div>
            <div class="progress-track"><span style="width: 1.02%"></span></div>
          </div>
          <span class="enter-course">進入課程 <b>→</b></span>
        </div>
      </a>
    </section>
  </main>

  <footer class="global-footer">
    <p>不保存逐字稿，只留下能重新使用的理解。</p>
  </footer>
</body>
</html>
